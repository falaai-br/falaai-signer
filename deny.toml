[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# A libsignal é AGPL-3.0; o crate também. Licenças permissivas são compatíveis.
allow = [
  "AGPL-3.0-only", "AGPL-3.0-or-later",
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "BSL-1.0",
]
confidence-threshold = 0.9
# A lista vale para as dependências que a libsignal vai trazer; não avisar sobre as ainda ausentes.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# A libsignal entra na bead seguinte; até lá a organização não aparece no grafo.
unused-allowed-org = "allow"
# Fontes git só da organização da Signal (libsignal e os forks que ela usa: boring, curve25519-dalek, SPQR).
[sources.allow-org]
github = ["signalapp"]
